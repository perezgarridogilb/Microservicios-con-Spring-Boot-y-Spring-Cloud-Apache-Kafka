server.port=8000

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/crudrapido
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create-drop

# Configuración de rutas para Swagger UI y OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Habilitar el soporte para paginación de Spring Data (Pageable)
springdoc.pageable-converter.enabled=true

# Definir el tipo de contenido predeterminado para las respuestas
springdoc.default-produces-media-type=application/json
